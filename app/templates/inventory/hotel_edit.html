{% extends "base.html" %}

{% block title %}Edit Hotel - Tours & Travels ERP{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-md-12">
        <h2><i class="fas fa-edit"></i> Edit Hotel</h2>
    </div>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">{{ hotel.hotel_name }}</h5>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('inventory.edit_hotel', id=hotel.id) }}">
                    <div class="row">
                        <div class="col-md-12 mb-3">
                            <label for="hotel_name" class="form-label">Hotel Name *</label>
                            <input type="text" class="form-control" id="hotel_name" name="hotel_name" value="{{ hotel.hotel_name }}" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="city" class="form-label">City *</label>
                            <input type="text" class="form-control" id="city" name="city" value="{{ hotel.city }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="star_rating" class="form-label">Star Rating</label>
                            <select class="form-select" id="star_rating" name="star_rating">
                                <option value="1" {% if hotel.star_rating == 1 %}selected{% endif %}>⭐ 1 Star</option>
                                <option value="2" {% if hotel.star_rating == 2 %}selected{% endif %}>⭐⭐ 2 Stars</option>
                                <option value="3" {% if hotel.star_rating == 3 %}selected{% endif %}>⭐⭐⭐ 3 Stars</option>
                                <option value="4" {% if hotel.star_rating == 4 %}selected{% endif %}>⭐⭐⭐⭐ 4 Stars</option>
                                <option value="5" {% if hotel.star_rating == 5 %}selected{% endif %}>⭐⭐⭐⭐⭐ 5 Stars</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="address" class="form-label">Address</label>
                        <input type="text" class="form-control" id="address" name="address" value="{{ hotel.address or '' }}">
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="total_rooms" class="form-label">Total Rooms *</label>
                            <input type="number" class="form-control" id="total_rooms" name="total_rooms" value="{{ hotel.total_rooms }}" min="1" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="available_rooms" class="form-label">Available Rooms *</label>
                            <input type="number" class="form-control" id="available_rooms" name="available_rooms" value="{{ hotel.available_rooms }}" min="0" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="price_per_night" class="form-label">Price per Night *</label>
                        <input type="number" class="form-control" id="price_per_night" name="price_per_night" value="{{ hotel.price_per_night }}" step="0.01" min="0" required>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Update Hotel
                        </button>
                        <a href="{{ url_for('inventory.list_hotels') }}" class="btn btn-secondary">
                            <i class="fas fa-times"></i> Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
