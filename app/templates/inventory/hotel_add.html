{% extends "base.html" %}

{% block title %}Add Hotel - Tours & Travels ERP{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-md-12">
        <h2><i class="fas fa-plus"></i> Add New Hotel</h2>
    </div>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Hotel Information</h5>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('inventory.add_hotel') }}">
                    <div class="row">
                        <div class="col-md-12 mb-3">
                            <label for="hotel_name" class="form-label">Hotel Name *</label>
                            <input type="text" class="form-control" id="hotel_name" name="hotel_name" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="city" class="form-label">City *</label>
                            <input type="text" class="form-control" id="city" name="city" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="star_rating" class="form-label">Star Rating</label>
                            <select class="form-select" id="star_rating" name="star_rating">
                                <option value="1">⭐ 1 Star</option>
                                <option value="2">⭐⭐ 2 Stars</option>
                                <option value="3" selected>⭐⭐⭐ 3 Stars</option>
                                <option value="4">⭐⭐⭐⭐ 4 Stars</option>
                                <option value="5">⭐⭐⭐⭐⭐ 5 Stars</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="address" class="form-label">Address</label>
                        <input type="text" class="form-control" id="address" name="address">
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="phone" class="form-label">Phone</label>
                            <input type="tel" class="form-control" id="phone" name="phone">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="total_rooms" class="form-label">Total Rooms *</label>
                            <input type="number" class="form-control" id="total_rooms" name="total_rooms" min="1" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="available_rooms" class="form-label">Available Rooms *</label>
                            <input type="number" class="form-control" id="available_rooms" name="available_rooms" min="0" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="price_per_night" class="form-label">Price per Night *</label>
                        <input type="number" class="form-control" id="price_per_night" name="price_per_night" step="0.01" min="0" required>
                    </div>

                    <div class="mb-3">
                        <label for="amenities" class="form-label">Amenities (Comma Separated)</label>
                        <input type="text" class="form-control" id="amenities" name="amenities" placeholder="Wi-Fi, Pool, AC, etc.">
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Add Hotel
                        </button>
                        <a href="{{ url_for('inventory.list_hotels') }}" class="btn btn-secondary">
                            <i class="fas fa-times"></i> Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
