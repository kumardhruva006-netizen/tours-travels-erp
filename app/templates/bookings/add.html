{% extends "base.html" %}

{% block title %}Create Booking - Tours & Travels ERP{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-md-12">
        <h2><i class="fas fa-calendar-plus"></i> Create New Booking</h2>
    </div>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Booking Details</h5>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('bookings.add_booking') }}">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="customer_id" class="form-label">Customer *</label>
                            <select class="form-select" id="customer_id" name="customer_id" required>
                                <option value="">Select Customer</option>
                                {% for customer in customers %}
                                <option value="{{ customer.id }}">{{ customer.first_name }} {{ customer.last_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="itinerary_id" class="form-label">Package *</label>
                            <select class="form-select" id="itinerary_id" name="itinerary_id" required>
                                <option value="">Select Package</option>
                                {% for itinerary in itineraries %}
                                <option value="{{ itinerary.id }}">{{ itinerary.package_name }} (₹{{ itinerary.price_per_person }})</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="travel_date" class="form-label">Travel Date *</label>
                            <input type="date" class="form-control" id="travel_date" name="travel_date" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="return_date" class="form-label">Return Date *</label>
                            <input type="date" class="form-control" id="return_date" name="return_date" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="number_of_persons" class="form-label">Number of Persons *</label>
                            <input type="number" class="form-control" id="number_of_persons" name="number_of_persons" min="1" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="assigned_guide_id" class="form-label">Assign Guide</label>
                            <select class="form-select" id="assigned_guide_id" name="assigned_guide_id">
                                <option value="">Select Guide</option>
                                {% for guide in staff %}
                                <option value="{{ guide.id }}">{{ guide.first_name }} {{ guide.last_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="special_requests" class="form-label">Special Requests</label>
                        <textarea class="form-control" id="special_requests" name="special_requests" rows="3"></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="status" class="form-label">Status</label>
                        <select class="form-select" id="status" name="status">
                            <option value="Pending">Pending</option>
                            <option value="Confirmed">Confirmed</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Create Booking
                        </button>
                        <a href="{{ url_for('bookings.list_bookings') }}" class="btn btn-secondary">
                            <i class="fas fa-times"></i> Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
