{% extends "base.html" %}

{% block title %}Edit Booking - Tours & Travels ERP{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-md-12">
        <h2><i class="fas fa-edit"></i> Edit Booking</h2>
    </div>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Booking #{{ booking.booking_number }}</h5>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('bookings.edit_booking', id=booking.id) }}">
                    <div class="mb-3">
                        <label for="status" class="form-label">Status *</label>
                        <select class="form-select" id="status" name="status" required>
                            <option value="Pending" {% if booking.status == 'Pending' %}selected{% endif %}>Pending</option>
                            <option value="Confirmed" {% if booking.status == 'Confirmed' %}selected{% endif %}>Confirmed</option>
                            <option value="Completed" {% if booking.status == 'Completed' %}selected{% endif %}>Completed</option>
                            <option value="Cancelled" {% if booking.status == 'Cancelled' %}selected{% endif %}>Cancelled</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="assigned_guide_id" class="form-label">Assign Guide</label>
                        <select class="form-select" id="assigned_guide_id" name="assigned_guide_id">
                            <option value="">Select Guide</option>
                            {% for guide in staff %}
                            <option value="{{ guide.id }}" {% if booking.assigned_guide_id == guide.id %}selected{% endif %}>{{ guide.first_name }} {{ guide.last_name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="special_requests" class="form-label">Special Requests</label>
                        <textarea class="form-control" id="special_requests" name="special_requests" rows="3">{{ booking.special_requests or '' }}</textarea>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Update Booking
                        </button>
                        <a href="{{ url_for('bookings.list_bookings') }}" class="btn btn-secondary">
                            <i class="fas fa-times"></i> Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
