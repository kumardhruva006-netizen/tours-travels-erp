{% extends "base.html" %}

{% block title %}Edit Staff - Tours & Travels ERP{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-md-12">
        <h2><i class="fas fa-edit"></i> Edit Staff</h2>
    </div>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">{{ staff.first_name }} {{ staff.last_name }}</h5>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('staff.edit_staff', id=staff.id) }}">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="first_name" class="form-label">First Name *</label>
                            <input type="text" class="form-control" id="first_name" name="first_name" value="{{ staff.first_name }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="last_name" class="form-label">Last Name *</label>
                            <input type="text" class="form-control" id="last_name" name="last_name" value="{{ staff.last_name }}" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="email" class="form-label">Email *</label>
                            <input type="email" class="form-control" id="email" name="email" value="{{ staff.email }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="phone" class="form-label">Phone *</label>
                            <input type="tel" class="form-control" id="phone" name="phone" value="{{ staff.phone }}" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="position" class="form-label">Position *</label>
                            <input type="text" class="form-control" id="position" name="position" value="{{ staff.position }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="experience_years" class="form-label">Experience (Years)</label>
                            <input type="number" class="form-control" id="experience_years" name="experience_years" value="{{ staff.experience_years or 0 }}" min="0">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="salary" class="form-label">Monthly Salary</label>
                            <input type="number" class="form-control" id="salary" name="salary" value="{{ staff.salary or 0 }}" step="0.01" min="0">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="languages" class="form-label">Languages</label>
                            <input type="text" class="form-control" id="languages" name="languages" value="{{ staff.languages or '' }}">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="availability" class="form-label">Availability</label>
                            <select class="form-select" id="availability" name="availability">
                                <option value="Available" {% if staff.availability == 'Available' %}selected{% endif %}>Available</option>
                                <option value="On Tour" {% if staff.availability == 'On Tour' %}selected{% endif %}>On Tour</option>
                                <option value="On Leave" {% if staff.availability == 'On Leave' %}selected{% endif %}>On Leave</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="city" class="form-label">City</label>
                            <input type="text" class="form-control" id="city" name="city" value="{{ staff.city or '' }}">
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Update Staff
                        </button>
                        <a href="{{ url_for('staff.list_staff') }}" class="btn btn-secondary">
                            <i class="fas fa-times"></i> Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
